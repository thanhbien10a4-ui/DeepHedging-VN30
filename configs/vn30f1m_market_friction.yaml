market:
  underlying: VN30
  hedge_instrument: VN30F1M
  contract_multiplier_vnd_per_index_point: 100000
  tick_size_index_points: 0.1
  price_limit_fraction: 0.07
  settlement_method: cash
  last_trading_day_rule: third_thursday_of_expiry_month_adjust_previous_trading_day_if_holiday

official_service_fees:
  hnx_index_futures_trading_fee_vnd_per_contract_per_match: 2700
  vsdc_pre_krx_position_management_fee_vnd_per_contract_account_day: 2550
  vsdc_post_krx_clearing_fee_vnd_per_contract_offset: 2550
  krx_go_live_date: '2025-05-05'
  margin_asset_management_rate_per_month: 0.000024
  margin_asset_management_min_vnd_per_account_month: 100000
  margin_asset_management_max_vnd_per_account_month: 1600000
  broker_commission_vnd_per_contract_per_match: null

personal_income_tax:
  tax_rate: 0.001
  formula: tax = settlement_price * contract_multiplier * abs(delta_contracts) * initial_margin_rate / 2 * tax_rate
  initial_margin_schedule_required: true
  reference_rate_only_for_sanity_examples: 0.17
  reference_rate_effective_example: '2024-12-20'
  warning: Do not use the reference 17% rate as a full 2017-2026 historical schedule.

execution_model:
  hedge_ratio_interpretation: continuous_contract_equivalent
  include_opening_trade: true
  include_rebalancing_trades: true
  include_closing_trade: true
  slippage_model_status: pending_empirical_calibration
  default_slippage_ticks: null
  integer_contract_rounding_status: pending_portfolio_notional_definition

known_limitations:
  - VN30F1M is a continuous front-month series and does not contain explicit contract IDs.
  - Exact historical roll execution and expiry settlement cannot be reconstructed from the daily continuous file alone.
  - Margin-management fees are account-level monthly charges and should not be naively allocated per hedge trade.
  - Broker commission is broker-specific and intentionally left unset.
  - Historical VSDC initial-margin schedule must be completed before tax-inclusive historical backtests are called final.

