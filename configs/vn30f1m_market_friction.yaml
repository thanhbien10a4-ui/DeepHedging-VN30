market:
  underlying: VN30
  hedge_instrument: VN30F1M
  contract_multiplier_vnd_per_index_point: 100000
  tick_size_index_points: 0.1
  price_limit_fraction: 0.07
  settlement_method: cash
  mark_to_market_frequency: daily
  last_trading_day_rule: third_thursday_of_expiry_month_adjust_previous_trading_day_if_holiday

portfolio:
  initial_vn30_portfolio_notional_vnd: 10000000000
  interpretation: 10bn VND is the VN30 spot/index exposure to be hedged, not a hard combined cash-plus-margin constraint
  value_evolution: initial_notional_times_current_spot_over_episode_start_spot
  hard_total_cash_constraint_enforced: false

official_service_fees:
  hnx_index_futures_trading_fee_vnd_per_contract_per_match: 2700
  vsdc_pre_krx_position_management_fee_vnd_per_contract_account_day: 2550
  vsdc_post_krx_clearing_fee_vnd_per_contract_offset: 2550
  krx_go_live_date: '2025-05-05'
  margin_asset_management_rate_per_month: 0.000024
  margin_asset_management_min_vnd_per_account_month: 100000
  margin_asset_management_max_vnd_per_account_month: 1600000
  broker_commission_vnd_per_contract_per_match: 3000

personal_income_tax:
  tax_rate: 0.001
  formula: tax = futures_execution_price * contract_multiplier * traded_contracts * initial_margin_rate / 2 * tax_rate
  initial_margin_rate_assumption: 0.5
  assumption_label: project_simplification_1_to_2_margin
  apply_to_open_rebalance_close_and_roll_trades: true
  warning: The 50% initial-margin rate is a project assumption (1 unit of margin supports 2 units of futures notional), not a historical VN30F1M margin schedule.

execution_model:
  hedge_ratio_interpretation: desired_futures_notional_divided_by_current_spot_portfolio_notional
  target_contract_formula: target_contracts = round(hedge_ratio * current_spot_portfolio_value / (futures_price * contract_multiplier))
  integer_contracts_required: true
  integer_rounding_rule: nearest_integer_half_up
  minimum_contracts: 0
  hedge_direction: short_futures_against_long_vn30_spot_exposure
  include_opening_trade: true
  include_rebalancing_trades: true
  include_closing_trade: true
  default_slippage_ticks: 1.0
  slippage_vnd_per_contract_formula: slippage_ticks * tick_size_index_points * contract_multiplier
  roll_rule: on_observed_expiry_proxy_date_close_old_and_open_next_contract
  roll_trade_quantity_formula: 2 * current_integer_contracts
  roll_price_series_treatment: continuous_front_month_price_is_not_modified

known_limitations:
  - VN30F1M is a continuous front-month series and does not contain explicit contract IDs.
  - Exact historical roll execution price spread cannot be reconstructed from the daily continuous file; roll is represented as a calendar cost proxy.
  - The 10bn VND amount is treated as the spot portfolio exposure, not a strict total cash constraint including futures margin.
  - The 1:2 margin ratio (50%) is a project assumption, not the historical exchange margin schedule.
  - Margin-asset management fees are account-level monthly charges and are not allocated to individual hedge trades in the core simulator.
  - Daily OHLC data cannot model intraday margin calls, intraday slippage, or limit-order execution.

